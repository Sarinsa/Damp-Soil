buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}
plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "dampsoil.mixins.refmap.json"
}

version = "${mc_version}-${mod_version}"
group = 'com.sarinsa.dampsoil'
archivesBaseName = 'damp-soil'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: 'official', version: "${mc_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dampsoil {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'dampsoil'

            arg "-mixin.config=dampsoil.mixins.json"
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'dampsoil'

            arg "-mixin.config=dampsoil.mixins.json"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'dampsoil'
        }

        data {
            args '--mod', 'dampsoil', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Crust; only implement the api, but include the entire mod at runtime
    implementation "curse.maven:crust-873570:${crust_api_version}"
    runtimeOnly "curse.maven:crust-873570:${crust_src_version}"

    runtimeOnly fg.deobf("curse.maven:jei-238222:${jei_version}")
    runtimeOnly fg.deobf("curse.maven:mekanism-268560:${mekanism_version}")

    implementation fg.deobf("curse.maven:sereneseasons-291874:${serene_seasons_version}")

    runtimeOnly fg.deobf("curse.maven:toughasnails-246391:${toughasnails_version}")
    compileOnly fg.deobf("curse.maven:toughasnails_api-246391:${toughasnails_api_version}")

    runtimeOnly fg.deobf("curse.maven:glitchcore-955399:${glitchcore_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Damp Soil",
                "Specification-Vendor"    : "Sarinsa",
                "Specification-Version"   : "1", //
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Sarinsa",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "dampsoil.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
